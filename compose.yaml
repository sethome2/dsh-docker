services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/sethome2/dsh-docker:latest}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - dsh-data:/home/node/.dsh
      - ./workspace:/home/node/Documents/deepseek-harness/default-workspace
    # command:
    #   - --public-url
    #   - https://dsh.example.com/
    #   - --trusted-host
    #   - dsh.example.com
volumes:
  dsh-data:
