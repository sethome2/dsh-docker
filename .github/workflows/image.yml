name: Build, test and publish

on:
  schedule:
    - cron: '0 20 * * *' # Daily at 04:00 Asia/Shanghai (20:00 UTC).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH npm version or dist-tag'
        default: latest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve upstream version
        id: upstream
        env:
          REQUESTED_VERSION: ${{ inputs.dsh_version || 'latest' }}
        run: |
          version=$(npm view "@deepseek-ai/dsh@${REQUESTED_VERSION}" version --json | node -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const version = JSON.parse(input);
            if (typeof version !== "string" || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) process.exit(1);
            console.log(version);
          ' --input-type=module)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DSH version: $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-docker:test
          build-args: DSH_VERSION=${{ steps.upstream.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test version, sandbox, Web UI and persistence
        env:
          DSH_IMAGE: dsh-docker:test
        run: |
          mkdir -p workspace
          sudo chown 1000:1000 workspace
          docker compose run --rm --no-deps --entrypoint dsh dsh --version
          docker compose run --rm --no-deps -v "$PWD/test:/opt/dsh/test:ro" --entrypoint sh dsh /opt/dsh/test/check-sandbox.sh
          node test/smoke.mjs
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Clean up
        if: always()
        run: docker compose down --volumes
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          immutable_tag="sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag dsh-docker:test "$image:$immutable_tag"
          docker tag dsh-docker:test "$image:latest"
          docker push "$image:$immutable_tag" | tee /tmp/dsh-push.log
          docker push "$image:latest"
          echo "Image: \`$image:$immutable_tag\`" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/digest:/p' /tmp/dsh-push.log >> "$GITHUB_STEP_SUMMARY"
